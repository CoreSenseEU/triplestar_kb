line-length = 99

[format]
quote-style = "single"
indent-style = "space"

[lint]
extend-select = [
  "T100",  # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
  "D",
  "D213",
  "T2",
  "TD",
  "UP",
  "I",
  "N",
  "E"
]
ignore = ["D1", "D212"]

[lint.per-file-ignores]
"triplestar_cli/triplestar_cli/**/*.py" = ["T201"]

[lint.pydocstyle]
convention = "pep257"

# Match the google import order that ament_flake8 enforces in the package tests:
# case-insensitive, with this repository's packages sorted as third-party.
[lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false
known-third-party = ["triplestar_*"]
