# Package manifest for Pixi: builds this ROS 2 package as a conda package.
# Name, version and dependencies come from package.xml. See the CoreSense
# guide: https://coresenseeu.github.io/tutorials/docs/pixi_release.html
[package]
publish = true

[package.build.backend]
name = "pixi-build-ros"
workspace = true

# rosdep keys from package.xml that the backend's RoboStack mapping does not
# know, mapped to their conda-forge names.
[[package.build.config.extra-package-mappings]]
python3-cookiecutter = { conda = ["cookiecutter"] }
python3-rich = { conda = ["rich"] }
